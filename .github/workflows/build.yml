name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: murren-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A rolling "latest" pre-release gives the phone a stable download link.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk murren.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest murren.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Debug build of $GITHUB_SHA. On your phone: download murren.apk and open it to install."
